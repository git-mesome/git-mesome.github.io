<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" font-family="ui-sans-serif, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- panels -->
  <rect x="20" y="20" width="530" height="440" rx="12" fill="none" stroke="#d1362b" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.6"/>
  <rect x="610" y="20" width="530" height="440" rx="12" fill="none" stroke="#189050" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.6"/>

  <!-- panel tags -->
  <g>
    <rect x="20" y="20" width="360" height="32" rx="8" fill="#fdeaea" stroke="#d1362b" stroke-width="1.5"/>
    <text x="200" y="41" text-anchor="middle" font-size="12.5" fill="#4a1313" font-weight="700">Before · PG 호출 + DB 저장이 한 트랜잭션</text>
  </g>
  <g>
    <rect x="610" y="20" width="330" height="32" rx="8" fill="#e6f7ee" stroke="#189050" stroke-width="1.5"/>
    <text x="775" y="41" text-anchor="middle" font-size="12.5" fill="#0f3d22" font-weight="700">After · PaymentService 오케스트레이터</text>
  </g>

  <!-- ===== Before: transaction scope box ===== -->
  <rect x="55" y="88" width="460" height="345" rx="10" fill="none" stroke="#d1362b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="55" y="88" width="230" height="26" rx="6" fill="#fdeaea" stroke="#d1362b" stroke-width="1.3"/>
  <text x="170" y="106" text-anchor="middle" font-size="11" fill="#4a1313" font-weight="600">트랜잭션 범위 (최대 8초 점유)</text>

  <line x1="285" y1="142" x2="285" y2="168" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="285" y1="253" x2="285" y2="279" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="285" y1="333" x2="285" y2="359" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow5)"/>

  <g>
    <rect x="95" y="118" width="380" height="50" rx="10" fill="#e9f0ff" stroke="#2c5cff" stroke-width="1.5"/>
    <text x="285" y="148" text-anchor="middle" font-size="14" fill="#152238" font-weight="600">트랜잭션 시작</text>
  </g>
  <g>
    <rect x="70" y="168" width="430" height="60" rx="10" fill="#fdeaea" stroke="#d1362b" stroke-width="1.5"/>
    <text x="285" y="192" text-anchor="middle" font-size="14" fill="#4a1313" font-weight="700">PG 호출</text>
    <text x="285" y="212" text-anchor="middle" font-size="12.5" fill="#4a1313">(최대 8초 대기)</text>
  </g>
  <g>
    <rect x="95" y="279" width="380" height="50" rx="10" fill="#e9f0ff" stroke="#2c5cff" stroke-width="1.5"/>
    <text x="285" y="309" text-anchor="middle" font-size="14" fill="#152238" font-weight="600">DB 저장</text>
  </g>
  <g>
    <rect x="95" y="359" width="380" height="50" rx="10" fill="#e9f0ff" stroke="#2c5cff" stroke-width="1.5"/>
    <text x="285" y="389" text-anchor="middle" font-size="14" fill="#152238" font-weight="600">트랜잭션 커밋</text>
  </g>

  <!-- ===== After ===== -->
  <g>
    <rect x="645" y="75" width="190" height="24" rx="5" fill="#f6f7f9" stroke="#8b93a3" stroke-width="1.2"/>
    <text x="740" y="91" text-anchor="middle" font-size="11" fill="#3c4a63">트랜잭션 경계 밖</text>
  </g>
  <g>
    <rect x="655" y="105" width="420" height="60" rx="10" fill="#e9f0ff" stroke="#2c5cff" stroke-width="1.5"/>
    <text x="865" y="129" text-anchor="middle" font-size="14" fill="#152238" font-weight="600">PG 호출</text>
    <text x="865" y="149" text-anchor="middle" font-size="12.5" fill="#3c4a63">(트랜잭션 없음)</text>
  </g>

  <line x1="865" y1="165" x2="865" y2="278" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="635" y="225" width="460" height="135" rx="10" fill="none" stroke="#189050" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="635" y="225" width="180" height="26" rx="6" fill="#e6f7ee" stroke="#189050" stroke-width="1.3"/>
  <text x="725" y="243" text-anchor="middle" font-size="11" fill="#0f3d22" font-weight="600">최소 범위 트랜잭션</text>

  <g>
    <rect x="655" y="278" width="420" height="66" rx="10" fill="#e6f7ee" stroke="#189050" stroke-width="1.5"/>
    <text x="865" y="305" text-anchor="middle" font-size="13.5" fill="#0f3d22" font-weight="600">PaymentTransactionService</text>
    <text x="865" y="325" text-anchor="middle" font-size="12.5" fill="#276b45">(최소 범위 트랜잭션)</text>
  </g>
